name: Update RightMoveRX videos
description: Request a refresh of the RightMoveRX YouTube video database.
title: "Update RightMoveRX videos"
body:
  - type: markdown
    attributes:
      value: |
        Submit this request to start the RightMoveRX video scraper.
        The workflow will update videos.json and report the result here.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirm update request
      options:
        - label: I want to start the video database update.
          required: true
    validations:
      required: true
