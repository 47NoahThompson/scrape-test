
name: Add Exercise Video
description: Submit a new exercise video to the RightMoveRX library.
title: "Add Exercise: "
labels:
  - exercise-submission

body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to the RightMoveRX exercise library!
        Please complete all four fields below.

  - type: input
    id: exercise_name
    attributes:
      label: Exercise Name
      description: What is the name of this exercise?
      placeholder: Backwards Step Up
    validations:
      required: true

  - type: input
    id: video_link
    attributes:
      label: Video Link
      description: Provide the YouTube URL for this exercise.
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true

  - type: checkboxes
    id: tags
    attributes:
      label: Exercise Tags
      description: Select all tags that apply to this exercise.
      options:
        - label: Head/Neck
        - label: Shoulders
        - label: Chest
        - label: Arms
        - label: Back
        - label: Low Back
        - label: Core
        - label: Hip/Pelvis
        - label: Upper Leg
        - label: Knee
        - label: Lower Leg
        - label: Foot/Ankle
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain how to perform the exercise and include any relevant instructions.
      placeholder: |
        1. Stand with your feet shoulder-width apart.
        2. Step backwards onto the platform.
        3. Return to the starting position.
      render: text
    validations:
      required: true
