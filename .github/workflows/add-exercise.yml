name: Add Exercise to Video Library

on:
  issues:
    types: [opened, labeled]

# Permissions required to update videos.json and manage issues.
permissions:
  contents: write
  issues: write

# Prevent multiple submissions from updating videos.json simultaneously.
concurrency:
  group: add-exercise-video-library
  queue: max

jobs:
  add-exercise:
    # Only process submissions with the correct label.
    if: >-
      contains(github.event.issue.labels.*.name, 'exercise-submission') &&
      (
        github.event.action == 'opened' ||
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'exercise-submission'
        )
      )

    runs-on: ubuntu-latest

    steps:
      # Check whether this issue is still open.
      - name: Check issue status
        id: issue_status
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              ...context.repo,
              issue_number: context.issue.number
            });

            core.setOutput(
              'is_open',
              issue.data.state === 'open' ? 'true' : 'false'
            );

      # Get repository files.
      - name: Checkout repository
        if: steps.issue_status.outputs.is_open == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      # Set up Python.
      - name: Set up Python
        if: steps.issue_status.outputs.is_open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Run the Python script to update videos.json.
      - name: Update videos.json
        id: update
        if: steps.issue_status.outputs.is_open == 'true'
        continue-on-error: true
        run: python .github/scripts/add_exercise.py

      # Commit and push the updated library.
      - name: Commit updated video library
        id: commit
        if: steps.update.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos.json

          git commit -m "Add exercise from issue #${{ github.event.issue.number }}"

          git push origin HEAD:main

      # Report the result on the GitHub issue.
      - name: Report result
        if: always() && steps.issue_status.outputs.is_open == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.issue.number;

            const updateSucceeded =
              '${{ steps.update.outcome }}' === 'success';

            const commitSucceeded =
              '${{ steps.commit.outcome }}' === 'success';

            if (updateSucceeded && commitSucceeded) {

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body:
                  'Successfully added this exercise to the RightMoveRX exercise library!'
              });

              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed'
              });

            } else {

              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body:
                  'There was a problem adding this exercise to the library. Please check the Actions tab for details.'
              });

            }
